name: Checks for bad rocm_score and labels

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

jobs:
  check-rocm-score:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      # Get only the JSON files that are part of this PR
      - name: Get JSON files changed in this PR
        if: github.event_name == 'pull_request'
        id: changed-json
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              }
            );

            const jsonFiles = files
              .filter(f => f.filename.endsWith('.json'))
              .map(f => f.filename);

            core.info(`JSON files in this PR: ${jsonFiles.join(', ') || 'none'}`);

            core.setOutput('file_found', jsonFiles.length > 0 ? 'true' : 'false');
            core.setOutput('json_file', jsonFiles[0] || '');

      - name: Compute ROCm score from PR JSON
        if: github.event_name == 'pull_request' && steps.changed-json.outputs.file_found == 'true'
        id: rocm
        run: |
          FILE="${{ steps.changed-json.outputs.json_file }}"

          echo "Using JSON file from PR: $FILE"

          if [ ! -f "$FILE" ]; then
            echo "File $FILE not found in workspace, skipping."
            echo "ROCM_SCORE=" >> $GITHUB_ENV
            exit 0
          fi

          # Grab first rocm_score line and extract the number with sed
          ROCM_SCORE=$(grep -m1 '"rocm_score"' "$FILE" | sed -E 's/.*"rocm_score": *([^, ]*).*/\1/' || echo "")

          if [ -z "$ROCM_SCORE" ]; then
            echo "No rocm_score found in $FILE, skipping label."
          else
            echo "Found ROCM_SCORE=$ROCM_SCORE"
          fi

          echo "ROCM_SCORE=$ROCM_SCORE" >> $GITHUB_ENV

      - name: Label PR if ROCm score < 90
        if: >
          github.event_name == 'pull_request' &&
          steps.changed-json.outputs.file_found == 'true' &&
          env.ROCM_SCORE != '' &&
          fromJSON(env.ROCM_SCORE) < 90
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: low-rocm-score
